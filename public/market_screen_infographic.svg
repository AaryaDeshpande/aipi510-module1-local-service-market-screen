<circle cx="1272" cy="990" r="10" fill="#8fa5a5" fill-opacity="0.55"/>
<text x="1295.0" y="997.0" class="caption" text-anchor="start">Other selected industries</text>
<rect x="0" y="1040" width="1800" height="160" fill="#173d40"/>
<text x="78.0" y="1088.0" class="footer-strong" text-anchor="start">Read the bubbles as interview leads—not addressable spend.</text>
<text x="78.0" y="1125.0" class="footer" text-anchor="start">Bubble area = number of employer locations with &lt;20 employees. The vertical measure is a constructed proxy:</text>
<text x="78.0" y="1153.0" class="footer" text-anchor="start">Census average employees/location × BLS office/admin employment share × BLS annual mean wage.</text>
<text x="78.0" y="1181.0" class="footer" text-anchor="start">Sources: 2023 Census CBP + May 2025 BLS OEWS. Not observed payroll, customer demand, or evidence of automatable work.</text>
</svg>
